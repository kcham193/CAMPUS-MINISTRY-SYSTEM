services:
  - type: web
    name: campus-impact
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: "./build.sh"
    startCommand: "gunicorn campus_impact.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: WEB_CONCURRENCY
        value: "2"
      - key: DATABASE_URL
        fromDatabase:
          name: campus-impact-db
          property: connectionString
      # Set CLOUDINARY_URL manually in the Render dashboard after signup
      # Format: cloudinary://API_KEY:API_SECRET@CLOUD_NAME

databases:
  - name: campus-impact-db
    plan: free
    region: frankfurt
    databaseName: campus_impact
    user: campus_impact
